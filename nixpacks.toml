[phases.install]
cmds = [
    "composer install --optimize-autoloader --no-scripts --no-interaction --ignore-platform-reqs",
    "npm install"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan config:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
